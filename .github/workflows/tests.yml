name: Offline tests and distributions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python tools/check_workflows.py
      - run: python -m build --no-isolation
      - run: python -m twine check --strict dist/*
      - run: python tools/check_dist.py dist/*
      - name: Install and test the wheel
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --require-hashes -r requirements.lock
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl
          .wheel-venv/bin/python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  pillow-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-compat.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
